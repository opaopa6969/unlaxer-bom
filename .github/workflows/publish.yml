name: publish to GitHub Packages

# unlaxer-bom（pom-only）を GitHub Packages（単一ホスト方式の unlaxer registry）へ publish する。
# これまで手動 deploy だったのを CI 化（設計 docs/design/vacant-bom-rdb-architecture.md §9）。
#
# 認証: distributionManagement の server id=github-unlaxer に PAT(write:packages)を渡す。
#    secret PACKAGES_PUBLISH_TOKEN を repo settings に登録すること（onigiri-parser の publish.yml と同じ secret 名）。
# 注意: リリース版は同一 version の再 deploy 不可（409）。再公開はトレイン番号（CalVer）を上げる。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "手動 deploy 理由"
        required: false
        default: "manual deploy"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Maven settings (GitHub Packages write)
        env:
          GH_PKG_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server><id>github-unlaxer</id><username>${{ github.repository_owner }}</username><password>${GH_PKG_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      # release 前の完全検証。PR の CI は secret を持たないため 12 座標中 5 座標しか
      # resolve を確かめられず、GitHub Packages 側の pin が架空でも green になる。
      # ここは write:packages トークン（read も含む）を持つので --require-all で全座標を要求する。
      # 失敗したら publish しない。トークンに read:packages が無い場合もここで止まる（fail-closed）。
      - name: Verify BOM consumer contract (all coordinates)
        env:
          GH_PKG_USER: ${{ github.repository_owner }}
          GH_PKG_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: python3 scripts/verify-bom-consumer-contract.py --include-github --require-all

      - name: Deploy BOM to GitHub Packages
        run: mvn -B -N deploy
